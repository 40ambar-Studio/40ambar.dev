services:
  dev:
    container_name: leidorf.link-dev
    build:
      context: .
      dockerfile: dev.Dockerfile
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  prod:
    container_name: leidorf.link-prod
    profiles:
      - production
    build:
      context: .
      dockerfile: prod.Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - shared-network

networks:
  shared-network:
    external: true
